name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t ${{ secrets.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            --push ./backend

      - name: Build frontend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t ${{ secrets.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            --push ./frontend

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name feedback-analyzer-eks

      - name: Replace image tags in manifests
        run: |
          sed -i "s|954718262221.dkr.ecr.eu-central-1.amazonaws.com/feedback-analyzer-backend:.*|${{ secrets.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|954718262221.dkr.ecr.eu-central-1.amazonaws.com/feedback-analyzer-frontend:.*|${{ secrets.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}|g" k8s/frontend-deployment.yaml

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout backend
        run: kubectl rollout status deployment/feedback-backend --timeout=120s

      - name: Wait for rollout frontend
        run: kubectl rollout status deployment/feedback-frontend --timeout=120s