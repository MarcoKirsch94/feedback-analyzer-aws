<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Customer Feedback Analyzer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="container">
    <section class="hero">
      <h1>Admin Dashboard</h1>
      <p>
        Übersicht über gespeicherte Feedbacks, Sentiments und Statistiken
        der letzten 7 Tage.
      </p>
      <nav>
        <a href="/index.html">Feedback</a>
        <a href="/admin.html">Admin</a>
      </nav>
    </section>
  </header>

  <main class="container">
    <section class="card">
      <h2>Statistik letzte 7 Tage</h2>
      <button id="refresh-stats-btn">Statistik aktualisieren</button>

      <div class="stats-grid">
        <div class="stat-box stat-positive">
          <span>POSITIVE</span>
          <strong id="stat-positive">0</strong>
        </div>
        <div class="stat-box stat-negative">
          <span>NEGATIVE</span>
          <strong id="stat-negative">0</strong>
        </div>
        <div class="stat-box stat-neutral">
          <span>NEUTRAL</span>
          <strong id="stat-neutral">0</strong>
        </div>
        <div class="stat-box stat-mixed">
          <span>MIXED</span>
          <strong id="stat-mixed">0</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Feedback-Liste</h2>

      <div class="filter-row">
        <div>
          <label for="sentiment-filter">Filter nach Sentiment</label>
          <select id="sentiment-filter">
            <option value="">Alle</option>
            <option value="POSITIVE">POSITIVE</option>
            <option value="NEGATIVE">NEGATIVE</option>
            <option value="NEUTRAL">NEUTRAL</option>
            <option value="MIXED">MIXED</option>
          </select>
        </div>

        <div></div>

        <button id="load-feedback-btn">Feedback laden</button>
      </div>

      <div id="feedback-list" class="feedback-list"></div>
    </section>

    <section class="card" id="admin-error-section" hidden>
      <h2>Fehler</h2>
      <p id="admin-error-message"></p>
    </section>
  </main>

  <footer class="container">
    Customer Feedback Analyzer · Admin Dashboard
  </footer>

  <script src="/admin.js"></script>
</body>
</html>
